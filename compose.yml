services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: LifeTree-backend
    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      - postgres
      - redis

    volumes:
      - ./backend:/app:Z
      - backend_node_modules:/app/node_modules

    command: npm run start:dev

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: LifeTree-frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app:Z
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend

    command: npm run dev -- --host 0.0.0.0

  postgres:
    image: postgres:18
    container_name: LifeTree-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: LifeTree
      POSTGRES_USER: LifeTree
      POSTGRES_PASSWORD: LifeTree_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: LifeTree-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  backend_node_modules:
  frontend_node_modules: